name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # Previous version, frozen at the v1 tag. Served at the site root.
          - name: v1
            ref: v1
          # Current work on main. Served at /v2/.
          - name: v2
            ref: main

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Artifactory credentials
        run: curl -sS -u "${ARTIFACTORY_USERNAME}:${ARTIFACTORY_API_KEY}" --fail https://zdrepo.jfrog.io/zdrepo/api/npm/npm/auth/zendesk-ui >> ~/.npmrc
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: ./dist
          retention-days: 1

  package:
    name: Package site
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download v1 build
        uses: actions/download-artifact@v4
        with:
          name: build-v1
          path: ./site

      - name: Download v2 build
        uses: actions/download-artifact@v4
        with:
          name: build-v2
          path: ./site/v2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    name: Deploy
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
